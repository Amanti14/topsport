<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>hEY! Admin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="lockScreen" class="lock-screen">
  <div class="logo-badge" style="width:64px;height:64px;font-size:20px;">hEY!</div>
  <h2 style="margin-top:8px;">Checking access…</h2>
  <p style="color:var(--text-soft);font-size:13px;" id="lockMsg">Verifying your Telegram account</p>
</div>

<div id="app" style="display:none;">
  <div class="header">
    <div class="header-row">
      <div class="logo-badge">hEY!</div>
      <div class="brand">hEY<span>!</span> Admin</div>
    </div>
    <div class="tagline">Manage your online market for gaming &amp; electronics</div>
  </div>

  <div class="stat-grid" id="statGrid"></div>

  <div class="tabs">
    <div class="tab active" data-tab="products" onclick="switchTab('products')">📦 Products</div>
    <div class="tab" data-tab="addProduct" onclick="switchTab('addProduct')">➕ Add Product</div>
    <div class="tab" data-tab="orders" onclick="switchTab('orders')">🧾 Orders</div>
    <div class="tab" data-tab="customers" onclick="switchTab('customers')">👥 Customers</div>
    <div class="tab" data-tab="bulk" onclick="switchTab('bulk')">⬆️ Bulk Import</div>
    <div class="tab" data-tab="categories" onclick="switchTab('categories')">🏷️ Categories</div>
    <div class="tab" data-tab="settings" onclick="switchTab('settings')">⚙️ Store</div>
  </div>

  <div class="content" id="content"></div>
</div>

<div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"><div class="sheet-handle"></div><div id="sheetContent"></div></div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();

// ==== CONFIGURE THIS ====
const API_BASE = "https://hey-market.amantifekede14.workers.dev"; // same worker URL as the customer app — no trailing slash!
// =========================

let store = { categories: [], products: [], orders: [], payment:{methods:[]}, shipping:{options:[]}, store:{}, theme:{} };
let activeTab = 'products';
let currentUser = null;

async function init(){
  const initData = tg?.initData || '';
  try{
    const res = await fetch(`${API_BASE}/api/admin/verify`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({initData})
    });
    const data = await res.json();
    if(!data.ok){
      document.getElementById('lockMsg').textContent = "You're not authorized to access this dashboard.";
      return;
    }
    currentUser = data.user;
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    await loadStore();
  }catch(e){
    document.getElementById('lockMsg').textContent = "Couldn't connect. Check the worker URL / your connection.";
  }
}
init();

async function loadStore(){
  try{
    const res = await fetch(`${API_BASE}/api/admin/store/load`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ initData: tg?.initData || '' })
    });
    const data = await res.json();
    if(!data.ok){
      document.getElementById('content').innerHTML = `<div class="card" style="border-color:var(--danger);">Couldn't load store data: ${data.error || 'unknown error'}</div>`;
      return;
    }
    store = normalizeStore(data.store);
    renderStats();
    render();
  }catch(e){
    document.getElementById('content').innerHTML = `<div class="card" style="border-color:var(--danger);">Couldn't load store data: ${e.message}. Check the worker URL and that it's deployed.</div>`;
  }
}

// Guards against corrupted or partial data saved to KV (missing fields, wrong types)
// so the app never silently crashes and shows a blank screen.
function normalizeStore(s){
  s = s && typeof s === 'object' ? s : {};
  return {
    store: s.store && typeof s.store === 'object' ? s.store : {},
    theme: s.theme && typeof s.theme === 'object' ? s.theme : {},
    categories: Array.isArray(s.categories) ? s.categories : [],
    products: Array.isArray(s.products) ? s.products : [],
    orders: Array.isArray(s.orders) ? s.orders : [],
    customers: s.customers && typeof s.customers === 'object' ? s.customers : {},
    payment: { methods: Array.isArray(s.payment?.methods) ? s.payment.methods : [] },
    shipping: { options: Array.isArray(s.shipping?.options) ? s.shipping.options : [] },
  };
}

async function persist(){
  try{
    const res = await fetch(`${API_BASE}/api/admin/store`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ initData: tg?.initData || '', store })
    });
    const data = await res.json();
    if(!data.ok) showToast(data.error ? `Save failed: ${data.error}` : `Save failed (status ${res.status})`);
    renderStats();
    return data.ok;
  }catch(e){
    showToast(`Save failed: ${e.message}`);
    return false;
  }
}

function switchTab(tab){
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab===tab));
  render();
}

function renderStats(){
  const totalProducts = store.products.length;
  const totalOrders = store.orders.length;
  const revenue = store.orders.filter(o=>o.status!=='cancelled').reduce((s,o)=>s+o.total,0);
  document.getElementById('statGrid').innerHTML = `
    <div class="stat"><div class="stat-icon">📦</div><div class="num">${totalProducts}</div><div class="label">Total Products</div></div>
    <div class="stat"><div class="stat-icon">🧾</div><div class="num">${totalOrders}</div><div class="label">Total Orders</div></div>
    <div class="stat"><div class="stat-icon">💰</div><div class="num">${revenue}</div><div class="label">Revenue (ETB)</div></div>
  `;
}

function render(){
  const c = document.getElementById('content');
  try{
    if(activeTab==='products') c.innerHTML = productsHtml();
    else if(activeTab==='addProduct') c.innerHTML = addProductHtml();
    else if(activeTab==='bulk') c.innerHTML = bulkImportHtml();
    else if(activeTab==='categories') c.innerHTML = categoriesHtml();
    else if(activeTab==='orders') c.innerHTML = ordersHtml();
    else if(activeTab==='customers') c.innerHTML = customersHtml();
    else if(activeTab==='settings') c.innerHTML = settingsHtml();
  }catch(e){
    c.innerHTML = `<div class="card" style="border-color:var(--danger);">Something went wrong loading this tab: ${e.message}</div>`;
  }
}

// ---- Products ----
function productsHtml(){
  if(store.products.length===0) return `<div class="card">No products yet. Tap + to add one.</div>`;
  return store.products.map(p => `
    <div class="card">
      <div class="prod-row">
        ${p.image ? `<img src="${p.image}">` : `<div class="noimg">📦</div>`}
        <div class="prod-info">
          <div class="prod-name">${p.name}</div>
          <div class="prod-meta">${p.price} ETB · ${p.stock} in stock · ${categoryName(p.categoryId)}</div>
        </div>
        <button class="icon-sm" onclick="openProductForm('${p.id}')">✏️</button>
        <button class="icon-sm danger" onclick="deleteProduct('${p.id}')">🗑️</button>
      </div>
    </div>`).join('');
}
function categoryName(id){ return store.categories.find(c=>c.id===id)?.name || '—'; }

// ---- Add Product (dedicated page, matches the requested layout) ----
function addProductHtml(){
  const catOptions = `<option value="">Select a category</option>` +
    store.categories.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  return `
    <div class="card">
      <div class="sheet-title" style="font-size:16px;">Add Product</div>
      <div class="field-row">
        <div class="field"><label>Product Name *</label><input id="apName" placeholder="e.g., PS5 Console"></div>
        <div class="field"><label>Category *</label><select id="apCat">${catOptions}</select></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Price (ETB) *</label><input id="apPrice" type="number" placeholder="99.99"></div>
        <div class="field"><label>Stock Quantity *</label><input id="apStock" type="number" placeholder="10"></div>
      </div>
      <div class="field"><label>Description</label><textarea id="apDesc" rows="3" placeholder="Product description..."></textarea></div>
      <div class="field"><label>Image URL</label><input id="apImage" placeholder="https://example.com/image.jpg"></div>
      <button class="btn-primary" onclick="createProductInline()">✨ Create Product</button>
    </div>`;
}
async function createProductInline(){
  const name = document.getElementById('apName').value.trim();
  const categoryId = document.getElementById('apCat').value;
  const price = Number(document.getElementById('apPrice').value);
  const stock = Number(document.getElementById('apStock').value);
  const description = document.getElementById('apDesc').value.trim();
  const image = document.getElementById('apImage').value.trim();

  if(!name || !categoryId || !price || !stock){
    showToast('Please fill in Product Name, Category, Price and Stock');
    return;
  }
  store.products.push({ id: 'p_'+Date.now(), name, categoryId, price, stock, image, description });
  const ok = await persist();
  if(ok){
    switchTab('products');
    showToast('Product created');
  }
}

// ---- Bulk Import ----
let bulkParsed = [];
function bulkImportHtml(){
  const catList = store.categories.map(c=>c.name).join(', ') || '(none yet — add categories first)';
  return `
    <div class="card">
      <div class="sheet-title" style="font-size:15px;">Bulk Import Products</div>
      <p style="font-size:12.5px;color:var(--text-soft);margin-bottom:10px;line-height:1.5;">
        One product per line, fields separated by <strong>|</strong>:<br>
        <code style="font-size:11.5px;">Name | Category | Price | Stock | Image URL | Description</code><br><br>
        Image URL and Description are optional (leave blank between pipes). Category must match one of your existing categories exactly: <strong>${catList}</strong>
      </p>
      <div class="field">
        <textarea id="bulkText" rows="8" placeholder="PS5 Digital Edition | PS5 | 45000 | 5 | | Latest slim model
iPhone 13 128GB | iPhones | 38000 | 3 | https://example.com/img.jpg | Unlocked, good condition"></textarea>
      </div>
      <button class="btn-primary" onclick="previewBulkImport()">Preview</button>
    </div>
    <div id="bulkPreview"></div>
  `;
}

function previewBulkImport(){
  const raw = document.getElementById('bulkText').value;
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  bulkParsed = [];
  const errors = [];

  lines.forEach((line, idx) => {
    const parts = line.split('|').map(p=>p.trim());
    const [name, catName, priceStr, stockStr, image, description] = parts;
    if(!name || !catName || !priceStr){
      errors.push(`Line ${idx+1}: missing name, category, or price — skipped`);
      return;
    }
    const cat = store.categories.find(c=>c.name.toLowerCase()===catName.toLowerCase());
    if(!cat){
      errors.push(`Line ${idx+1}: category "${catName}" not found — skipped`);
      return;
    }
    const price = Number(priceStr);
    if(!Number.isFinite(price)){
      errors.push(`Line ${idx+1}: invalid price "${priceStr}" — skipped`);
      return;
    }
    const stock = Number.isFinite(Number(stockStr)) ? Number(stockStr) : 0;
    bulkParsed.push({
      id: 'p_' + Date.now() + '_' + idx,
      name, categoryId: cat.id, price, stock,
      image: image || '', description: description || ''
    });
  });

  const preview = document.getElementById('bulkPreview');
  const rows = bulkParsed.map(p => `
    <div class="prod-row" style="padding:8px 0;border-bottom:1px solid var(--border);">
      ${p.image ? `<img src="${p.image}">` : `<div class="noimg">📦</div>`}
      <div class="prod-info">
        <div class="prod-name">${p.name}</div>
        <div class="prod-meta">${p.price} ETB · ${p.stock} in stock · ${categoryName(p.categoryId)}</div>
      </div>
    </div>`).join('');
  const errorBlock = errors.length ? `<div class="card" style="border-color:var(--danger);"><strong style="color:var(--danger);font-size:13px;">${errors.length} line(s) skipped:</strong><div style="font-size:12px;color:var(--text-soft);margin-top:6px;">${errors.join('<br>')}</div></div>` : '';

  preview.innerHTML = `
    ${errorBlock}
    <div class="card">
      <strong style="font-size:13px;">${bulkParsed.length} product(s) ready to import</strong>
      ${rows}
      ${bulkParsed.length ? `<button class="btn-primary" onclick="confirmBulkImport()">Import ${bulkParsed.length} Product(s)</button>` : ''}
    </div>
  `;
}

async function confirmBulkImport(){
  if(bulkParsed.length === 0) return;
  store.products.push(...bulkParsed);
  const ok = await persist();
  if(ok){
    const count = bulkParsed.length;
    bulkParsed = [];
    document.getElementById('bulkText').value = '';
    document.getElementById('bulkPreview').innerHTML = '';
    switchTab('products');
    showToast(`${count} products imported`);
  }
}

function openProductForm(id){
  const p = id ? store.products.find(x=>x.id===id) : null;
  const catOptions = store.categories.map(c=>`<option value="${c.id}" ${p?.categoryId===c.id?'selected':''}>${c.name}</option>`).join('');
  document.getElementById('sheetContent').innerHTML = `
    <div class="sheet-body">
      <div class="sheet-title">${p ? 'Edit Product' : 'Add Product'}</div>
      <div class="field"><label>Name</label><input id="pfName" value="${p?.name||''}" placeholder="e.g. PS5 Digital Edition"></div>
      <div class="field"><label>Category</label><select id="pfCat">${catOptions}</select></div>
      <div class="field"><label>Price (ETB)</label><input id="pfPrice" type="number" value="${p?.price||''}"></div>
      <div class="field"><label>Stock Quantity</label><input id="pfStock" type="number" value="${p?.stock??''}"></div>
      <div class="field"><label>Image URL</label><input id="pfImage" value="${p?.image||''}" placeholder="https://..."></div>
      <div class="field"><label>Description</label><textarea id="pfDesc" rows="3">${p?.description||''}</textarea></div>
      <button class="btn-primary" onclick="saveProduct(${p?`'${p.id}'`:'null'})">Save Product</button>
    </div>`;
  openSheet();
}
async function saveProduct(id){
  const name = document.getElementById('pfName').value.trim();
  const categoryId = document.getElementById('pfCat').value;
  const price = Number(document.getElementById('pfPrice').value);
  const stock = Number(document.getElementById('pfStock').value);
  const image = document.getElementById('pfImage').value.trim();
  const description = document.getElementById('pfDesc').value.trim();
  if(!name || !price){ showToast('Name and price are required'); return; }

  if(id){
    const p = store.products.find(x=>x.id===id);
    Object.assign(p, {name, categoryId, price, stock, image, description});
  } else {
    store.products.push({ id: 'p_'+Date.now(), name, categoryId, price, stock, image, description });
  }
  const ok = await persist();
  if(ok){ closeSheet(); render(); showToast('Product saved'); }
}
async function deleteProduct(id){
  store.products = store.products.filter(p=>p.id!==id);
  const ok = await persist();
  if(ok){ render(); showToast('Product deleted'); }
}

// ---- Categories ----
function categoriesHtml(){
  const rows = store.categories.map(c => `
    <div class="card">
      <div class="row">
        <div><span style="font-size:18px;margin-right:8px;">${c.icon||'🛍️'}</span><strong>${c.name}</strong></div>
        <button class="icon-sm danger" onclick="deleteCategory('${c.id}')">🗑️</button>
      </div>
    </div>`).join('');
  return `${rows}
    <div class="card">
      <div class="sheet-title" style="font-size:14px;">Add Category</div>
      <div class="field"><label>Name</label><input id="catName" placeholder="e.g. Laptops"></div>
      <div class="field"><label>Emoji Icon</label><input id="catIcon" placeholder="💻"></div>
      <button class="btn-primary" onclick="addCategory()">Add Category</button>
    </div>`;
}
async function addCategory(){
  const name = document.getElementById('catName').value.trim();
  const icon = document.getElementById('catIcon').value.trim() || '🛍️';
  if(!name){ showToast('Category name required'); return; }
  store.categories.push({ id: 'c_'+Date.now(), name, icon });
  const ok = await persist();
  if(ok){ render(); showToast('Category added'); }
}
async function deleteCategory(id){
  store.categories = store.categories.filter(c=>c.id!==id);
  const ok = await persist();
  if(ok){ render(); showToast('Category removed'); }
}

// ---- Orders ----
function ordersHtml(){
  if(store.orders.length===0) return `<div class="card">No orders yet.</div>`;
  return store.orders.map(orderRowHtml).join('');
}
function orderRowHtml(o){
  return `<div class="card" onclick="openOrderDetail('${o.id}')">
    <div class="row">
      <strong style="font-size:13px;">${o.customerName}</strong>
      <span class="status-pill status-${o.status}">${o.status}</span>
    </div>
    <div class="prod-meta" style="margin-top:4px;">${o.items.length} item(s) · ${o.total} ETB · ${new Date(o.createdAt).toLocaleString()}</div>
  </div>`;
}
function openOrderDetail(id){
  const o = store.orders.find(x=>x.id===id);
  const itemsHtml = o.items.map(i=>`<div class="row" style="padding:6px 0;font-size:13px;"><span>${i.name} x${i.qty}</span><span>${i.price*i.qty} ETB</span></div>`).join('');
  const statuses = ['pending','confirmed','delivered','cancelled'];
  document.getElementById('sheetContent').innerHTML = `
    <div class="sheet-body">
      <div class="sheet-title">Order Details</div>
      <div class="field"><label>Customer</label><input value="${o.customerName}" disabled></div>
      <div class="field"><label>Phone</label><input value="${o.customerPhone}" disabled></div>
      ${o.note ? `<div class="field"><label>Note</label><input value="${o.note}" disabled></div>` : ''}
      <div class="field"><label>Items</label>${itemsHtml}</div>
      <div class="row" style="font-weight:700;padding:10px 0;border-top:1px solid var(--border);"><span>Total</span><span>${o.total} ETB</span></div>
      <div class="field"><label>Update Status</label>
        <select id="ordStatus">${statuses.map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${s}</option>`).join('')}</select>
      </div>
      <button class="btn-primary" onclick="updateOrderStatus('${o.id}')">Update Status</button>
    </div>`;
  openSheet();
}
async function updateOrderStatus(id){
  const o = store.orders.find(x=>x.id===id);
  o.status = document.getElementById('ordStatus').value;
  const ok = await persist();
  if(ok){ closeSheet(); render(); showToast('Order updated'); }
}

// ---- Customers ----
function timeAgo(iso){
  if(!iso) return 'never';
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diffMs / 60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if(hrs < 24) return `${hrs}h ago`;
  return `${Math.floor(hrs / 24)}d ago`;
}

function cartValue(cart){
  return (cart||[]).reduce((sum,i)=>{
    const p = store.products.find(x=>x.id===i.productId);
    return sum + (p ? p.price * i.qty : 0);
  }, 0);
}

function customersHtml(){
  const list = Object.entries(store.customers || {})
    .map(([id, record]) => ({ id, ...record }))
    .sort((a,b) => new Date(b.lastActiveAt||0) - new Date(a.lastActiveAt||0));

  if(list.length === 0){
    return `<div class="card">No one has signed in with Telegram yet. As customers choose "Continue with Telegram" in the store, they'll show up here.</div>`;
  }

  return list.map(c => {
    const t = c.telegram || {};
    const name = [t.first_name, t.last_name].filter(Boolean).join(' ') || c.savedInfo?.name || 'Unknown';
    const avatar = t.photo_url ? `<img src="${t.photo_url}">` : `<div class="noimg">👤</div>`;
    const cart = c.cart || [];
    const cartRows = cart.map(i => {
      const p = store.products.find(x=>x.id===i.productId);
      return `<div class="row" style="font-size:12px;padding:3px 0;"><span>${p ? p.name : 'Unknown item'} x${i.qty}</span><span>${p ? p.price*i.qty : 0} ETB</span></div>`;
    }).join('');

    return `<div class="card">
      <div class="prod-row" style="align-items:flex-start;">
        ${avatar}
        <div class="prod-info">
          <div class="prod-name">${name}</div>
          <div class="prod-meta">${t.username ? '@'+t.username : 'no username'} · active ${timeAgo(c.lastActiveAt)}</div>
          ${c.savedInfo?.phone ? `<div class="prod-meta">📞 ${c.savedInfo.phone}</div>` : ''}
        </div>
        <button class="icon-sm" onclick="openDmModal('${c.id}')">💬</button>
      </div>
      ${cart.length > 0 ? `
        <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);">
          <div style="font-size:11.5px;font-weight:700;color:var(--text-soft);margin-bottom:4px;">🛒 CURRENT CART (${cartValue(cart)} ETB)</div>
          ${cartRows}
        </div>` : `<div style="margin-top:8px;font-size:11.5px;color:var(--text-soft);">Cart is empty</div>`
      }
    </div>`;
  }).join('');
}

function openDmModal(customerId){
  const c = store.customers[customerId];
  const t = c?.telegram || {};
  const name = [t.first_name, t.last_name].filter(Boolean).join(' ') || 'this customer';
  document.getElementById('sheetContent').innerHTML = `
    <div class="sheet-body">
      <div class="sheet-title">Message ${name}</div>
      <div class="field"><textarea id="dmText" rows="4" placeholder="Type your message..."></textarea></div>
      <button class="btn-primary" onclick="sendDm('${customerId}')">Send Message</button>
    </div>`;
  openSheet();
}

async function sendDm(customerId){
  const message = document.getElementById('dmText').value.trim();
  if(!message){ showToast('Type a message first'); return; }
  try{
    const res = await fetch(`${API_BASE}/api/admin/dm`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ initData: tg?.initData || '', telegramUserId: Number(customerId), message })
    });
    const data = await res.json();
    if(data.ok){ closeSheet(); showToast('Message sent ✓'); }
    else showToast(data.error || 'Could not send message');
  }catch(e){
    showToast('Network error — please try again');
  }
}

// ---- Settings ----
function settingsHtml(){
  const s = store.store || {};
  return `<div class="card">
    <div class="field"><label>Store Name</label><input id="stName" value="${s.name||''}"></div>
    <div class="field"><label>Tagline</label><input id="stTagline" value="${s.tagline||''}"></div>
    <button class="btn-primary" onclick="saveSettings()">Save Store Info</button>
  </div>
  <div class="card">
    <div class="sheet-title" style="font-size:14px;">Payment Methods</div>
    ${(store.payment.methods||[]).map((m,i)=>`
      <div class="field">
        <label>Method Name</label><input value="${m.name}" onchange="store.payment.methods[${i}].name=this.value">
        <label style="margin-top:6px;">Details</label><input value="${m.details}" onchange="store.payment.methods[${i}].details=this.value">
      </div>`).join('')}
    <button class="btn-primary" onclick="persist().then(()=>showToast('Payment methods saved'))">Save Payment Methods</button>
  </div>`;
}
async function saveSettings(){
  store.store = store.store || {};
  store.store.name = document.getElementById('stName').value.trim();
  store.store.tagline = document.getElementById('stTagline').value.trim();
  const ok = await persist();
  if(ok) showToast('Store info saved');
}

// ---- Sheet helpers ----
function openSheet(){ document.getElementById('sheetOverlay').classList.add('open'); document.getElementById('sheet').classList.add('open'); }
function closeSheet(){ document.getElementById('sheetOverlay').classList.remove('open'); document.getElementById('sheet').classList.remove('open'); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display='block';
  clearTimeout(window._t); window._t = setTimeout(()=>{t.style.display='none';}, 4000);
}
</script>
